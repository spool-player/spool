name: Rescan released SBOMs

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescan:
    name: Grype latest prerelease SBOMs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Install pinned Grype
        run: tools/install-release-scanners.sh "$RUNNER_TEMP/release-tools"
      - name: Download latest release SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir sboms
          tag="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')"
          test -n "$tag"
          gh release download "$tag" --pattern '*.syft.json' --pattern 'ffmpeg-vex.json' --dir sboms
          test -n "$(find sboms -type f -name '*.syft.json' -print -quit)"
      - name: Enforce vulnerability policy
        run: |
          set -euo pipefail
          for sbom in sboms/*.syft.json; do
            "$RUNNER_TEMP/release-tools/grype" "sbom:$sbom" --vex sboms/ffmpeg-vex.json --fail-on high --only-fixed
          done
