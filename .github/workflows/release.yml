name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release input
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Validate tag and embedded versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || {
            printf 'expected v0.x.y, got %s\n' "$RELEASE_TAG" >&2
            exit 1
          }
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          tools/check-release-version.sh "${RELEASE_TAG#v}"
      - name: Package exact corresponding source
        run: tools/package-release-source.sh release-source
      - name: Upload corresponding source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: spool-corresponding-source
          path: release-source/*
          retention-days: 1

  platforms:
    needs: validate
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-artifacts.yml
    with:
      release: true
      enable_macos_signing: ${{ vars.ENABLE_MACOS_SIGNING == 'true' }}
    secrets: inherit


  publish:
    name: Scan, attest, and publish prerelease
    needs: platforms
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Download final packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          # Everything that lands here is flattened together, checksummed,
          # attested and published, so only what a person should be offered
          # may arrive. Build inputs for other jobs are named internal-* and
          # this is what keeps them out.
          pattern: spool-*
          merge-multiple: true
      - name: Install analysis prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes p7zip-full
          tools/install-release-scanners.sh "$RUNNER_TEMP/release-tools"
      - name: Generate and scan per-package SBOMs
        env:
          SYFT: ${{ runner.temp }}/release-tools/syft
          GRYPE: ${{ runner.temp }}/release-tools/grype
        run: |
          tools/analyze-release-artifacts.sh release-assets release-reports
          rm release-assets/*.dmg.app.tar.gz
          mv release-reports/* release-assets/
      - name: Generate all-platform website metadata
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 tools/generate-website-manifest.py release-assets \
            release-assets/website-release.json --tag "$TAG" --repository "$REPO"
      - name: Generate final checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          checksum_file="$RUNNER_TEMP/SHA256SUMS.txt"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z | xargs -0 sha256sum >"$checksum_file"
          mv "$checksum_file" SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Attest final release files
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/*
      - name: Write release safety notice
        env:
          MACOS_SIGNED: ${{ vars.ENABLE_MACOS_SIGNING == 'true' }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/$TAG"
          gh api --method POST "repos/$REPO/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body >generated-notes.md


          # The asset list is mostly SBOM and scan sidecars, which bury the
          # files people actually install. Build the table from what is really
          # on disk so a renamed or dropped package leaves no dead link. Every
          # sidecar ends in .json, so matching each package's own suffix keeps
          # them out without naming them. The Arch package ships as an asset
          # with no row of its own: docs/install/arch.md is where somebody
          # arrives at it from.
          rows=()
          add_row() {
            local label="$1" pattern="$2" name
            name="$(find release-assets -maxdepth 1 -type f -name "$pattern" -printf '%f\n' \
              | sort | head -1)"
            [[ -n "$name" ]] || return 0
            rows+=("| $label | [\`$name\`]($base/$name) |")
          }
          add_row 'macOS — Apple Silicon' '*-macOS-arm64.dmg'
          add_row 'macOS — Intel' '*-macOS-x86_64.dmg'
          add_row 'Windows — installer' '*-Windows-x64-Setup.exe'
          add_row 'Windows — portable' '*-Windows-x64-Portable.exe'
          add_row 'Linux — AppImage' '*-x86_64.AppImage'
          add_row 'Linux — portable tarball' '*-linux-x86_64.tar.zst'
          add_row 'LG webOS TV' '*_arm.ipk'
          # One package serves phones and televisions, so the only remaining
          # choice is architecture -- and the universal APK exists so that
          # somebody who does not know theirs does not have to make it. It
          # goes first for that reason.
          add_row 'Android phone or TV — Universal' 'spool-universal.apk'
          add_row 'Android phone or TV — 64-bit ARM' 'spool-arm64-v8a.apk'
          add_row 'Android phone or TV — 32-bit ARM' 'spool-armeabi-v7a.apk'
          add_row 'Android phone or TV — x86-64' 'spool-x86_64.apk'

          {
            cat generated-notes.md
            echo
            if (( ${#rows[@]} )); then
              echo '## Downloads'
              echo
              echo '| Platform | File |'
              echo '| --- | --- |'
              printf '%s\n' "${rows[@]}"
              echo
              echo "Checksums: [\`SHA256SUMS.txt\`]($base/SHA256SUMS.txt)."
              echo
            fi
            if [[ "$MACOS_SIGNED" != true ]]; then
              echo 'The macOS DMG is **not Developer ID signed or notarized**.'
            fi
          } >release-notes.md
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "${assets[@]}" \
            --verify-tag \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false
      - name: Generate platform update metadata
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          IFS=. read -r major minor patch <<<"$version"
          version_code=$((major * 100000000 + minor * 100000 + patch * 100 + 99))
          base="https://github.com/$REPO/releases/download/$TAG"
          mkdir -p update-pages/updates

          for platform in android webos; do
            assets='{}'
            if [[ "$platform" = android ]]; then
              # Android uses only per-ABI packages, never the universal APK.
              for abi in arm64-v8a armeabi-v7a x86_64; do
                apk="release-assets/spool-$abi.apk"
                test -f "$apk"
                assets="$(jq -n \
                  --argjson acc "$assets" \
                  --arg key "$abi" \
                  --arg url "$base/$(basename "$apk")" \
                  --arg sha "$(sha256sum "$apk" | cut -d' ' -f1)" \
                  --argjson size "$(stat -c%s "$apk")" \
                  '$acc + {($key): {url: $url, sha256: $sha, size: $size}}')"
              done
            else
              ipk="release-assets/com.sachk.spool_${version}_arm.ipk"
              test -f "$ipk"
              assets="$(jq -n \
                --arg url "$base/$(basename "$ipk")" \
                --arg sha "$(sha256sum "$ipk" | cut -d' ' -f1)" \
                --argjson size "$(stat -c%s "$ipk")" \
                '{arm: {url: $url, sha256: $sha, size: $size}}')"
            fi

            jq -n \
              --arg version "$version" \
              --argjson versionCode "$version_code" \
              --arg releaseUrl "https://github.com/$REPO/releases/tag/$TAG" \
              --rawfile notes generated-notes.md \
              --argjson assets "$assets" \
              '{
                schemaVersion: 1,
                releases: [{
                  channel: "release",
                  version: $version,
                  versionCode: $versionCode,
                  releaseUrl: $releaseUrl,
                  notes: $notes,
                  assets: $assets
                }]
              }' >"update-pages/updates/$platform.json"
            jq -e '.schemaVersion == 1 and (.releases | length) == 1' "update-pages/updates/$platform.json"
          done

          # The universal APK is for people choosing a download by hand. An
          # installed build must never be offered it: it carries a second
          # architecture the device will never load and would roughly double
          # the update. Nothing above adds it, and this is what keeps it so.
          test -f release-assets/spool-universal.apk
          ! jq -e '[.releases[].assets[].url] | any(endswith("spool-universal.apk"))' \
            update-pages/updates/android.json >/dev/null
      - name: Include exact release manifest in Pages
        run: cp release-assets/website-release.json update-pages/updates/latest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: spool-update-pages
          path: update-pages
          retention-days: 1

  update-aur-recipe:
    name: Record the release checksum in the AUR recipe
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # master, not the tag: the recipe an AUR user builds from is the one on
      # the branch, and the checksum cannot exist until the assets are up.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: master
      - name: Record the published tarball's checksum
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # master can already be on the next version by the time a tag
          # finishes. A checksum for a release the recipe no longer names
          # would be worse than the one it has.
          if ! grep -Fqx "pkgver=$version" packaging/aur/PKGBUILD; then
            echo "::notice::packaging/aur is past $version on master; left alone"
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP"
          bundle="Spool-$version-linux-x86_64.tar.zst"
          checksum="$(awk -v want="$bundle" \
            '{ sub(/^\*/, "", $2); if ($2 == want) print $1 }' \
            "$RUNNER_TEMP/SHA256SUMS.txt")"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]] || {
            printf 'no checksum for %s in the release\n' "$bundle" >&2
            exit 1
          }
          bash tools/update-aur-checksums.sh "$checksum"
      - name: Commit the recipe
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- packaging/aur; then
            echo "::notice::the recipe already carries this checksum"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(aur): record the $TAG tarball checksum" -- packaging/aur
          git push origin HEAD:master

  deploy-update-metadata:
    name: Publish platform update metadata
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spool-update-pages
          path: update-pages
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: update-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  publish-website-metadata:
    name: Trigger website build with exact release metadata
    needs: deploy-update-metadata
    if: github.repository == 'spool-player/spool' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    concurrency:
      group: website-release-snapshot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Download the exact deployed Pages input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spool-update-pages
          path: update-pages
      - name: Commit public release snapshot to website main
        env:
          WEBSITE_DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/publish-website-metadata.py \
            update-pages/updates/latest.json --tag "$TAG"
