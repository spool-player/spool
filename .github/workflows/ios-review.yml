name: iOS device IPA and simulator smoke
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Use release artifact retention; the device IPA remains unsigned"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        description: "Use release artifact retention; the device IPA remains unsigned"
        type: boolean
        default: false
  push:
    branches: [feature/ios]
permissions:
  contents: read
jobs:
  native:
    name: iOS (${{ matrix.sdk }} ${{ matrix.arch }})
    runs-on: macos-15-intel
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphonesimulator
            arch: x86_64
          - sdk: iphoneos
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Validate immutable package version
        shell: bash
        run: |
          source tools/lib/build-common.sh
          version="$(read_project_version "$GITHUB_WORKSPACE")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo "error: release tag must match VERSION ($version)" >&2
              exit 1
            }
          fi
          echo "Building source $GITHUB_SHA with bundle/package version $version"
      - name: Install native build tools
        run: brew install cmake ninja meson pkg-config bash python imagemagick nasm gpatch
      - name: Install pinned Qt host and iOS kits
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall==3.3.0
          qt_version="$(bash tools/toolchain-versions.sh qt.version)"
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop "$qt_version" clang_64 -O "$RUNNER_TEMP/Qt" -m qtshadertools qtwebsockets qtimageformats qttasktree
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac ios "$qt_version" ios -O "$RUNNER_TEMP/Qt" -m qtshadertools qtwebsockets qtimageformats qttasktree
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/$qt_version/macos" >> "$GITHUB_ENV"
          echo "QT_TARGET_PREFIX=$RUNNER_TEMP/Qt/$qt_version/ios" >> "$GITHUB_ENV"
      - name: Build native iOS application
        shell: bash
        env:
          APPLE_SDK: ${{ matrix.sdk }}
          APPLE_ARCH: ${{ matrix.arch }}
          APPLE_CODE_SIGNING_ALLOWED: 'NO'
          # The published IPA is unsigned, for sideloading, so it is the open
          # build (all providers, provider downloads); the simulator smoke
          # starts the same flavour.
          SPOOL_APPLE_APP_STORE: 'OFF'
          BUILD_JOBS: '4'
        run: bash tools/build-ios.sh
      - uses: ./.github/actions/install-nix
        if: matrix.sdk == 'iphonesimulator'
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - name: Install Cachix from the Intel macOS pin
        if: matrix.sdk == 'iphonesimulator'
        run: bash tools/install-intel-darwin-cachix.sh
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1
        if: matrix.sdk == 'iphonesimulator'
        with:
          name: spool
          skipPush: true
      - name: Select supported Intel macOS native package channel
        if: matrix.sdk == 'iphonesimulator'
        shell: bash
        run: |
          url="$(python3 -c 'import json; p=json.load(open("flake.lock"))["nodes"]["nixpkgs-x86-darwin"]["locked"]; print("github:"+p["owner"]+"/"+p["repo"]+"/"+p["rev"])')"
          nix flake lock --override-input nixpkgs "$url"
      - name: Build native host controller for iOS application journeys
        if: matrix.sdk == 'iphonesimulator'
        run: |
          nix develop .#native -c cmake -S tests/e2e/host -B build/apple/device-journey-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          nix develop .#native -c cmake --build build/apple/device-journey-host
      - name: Run iOS traditional and real GPU GUI e2e tests
        if: matrix.sdk == 'iphonesimulator'
        env:
          SPOOL_TVOS_TEST_BUILD_DIR: build/apple/iphonesimulator-x86_64/app
          SPOOL_DEVICE_HOST_BUILD_DIR: build/apple/device-journey-host
        run: bash tools/apple/smoke-ios.sh build/apple/iphonesimulator-x86_64/install/Spool.app
      - name: Package audited unsigned device IPA
        if: matrix.sdk == 'iphoneos'
        shell: bash
        run: bash tools/package-ios.sh build/apple/iphoneos-arm64/app/Release-iphoneos/Spool.app dist/ios
      - name: Upload only the unsigned device release package
        if: matrix.sdk == 'iphoneos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: spool-ios-device-arm64
          path: dist/ios/Spool-*-iOS-arm64.ipa
          if-no-files-found: error
          retention-days: ${{ inputs.release && 1 || 7 }}
      - name: Archive simulator bundle preserving executable permissions
        if: matrix.sdk == 'iphonesimulator'
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/ios-simulator-x86_64.tar.gz" \
            -C build/apple/iphonesimulator-x86_64/app/Release-iphonesimulator Spool.app
      - name: Keep simulator build internal
        if: matrix.sdk == 'iphonesimulator'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: internal-ios-simulator-x86_64
          path: ${{ runner.temp }}/ios-simulator-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Keep simulator test diagnostics internal
        if: always() && matrix.sdk == 'iphonesimulator'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: internal-ios-simulator-x86_64-tests
          path: |
            build/ios/smoke/safe-export
            build/ios/smoke/launch-result.json
            build/ios/smoke/simulator.png
            build/ios/smoke/simulator-boot-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Document unsigned artifact boundary
        if: matrix.sdk == 'iphoneos'
        shell: bash
        run: |
          echo '### Unsigned iOS device IPA' >> "$GITHUB_STEP_SUMMARY"
          echo 'The audited arm64 device bundle has matching VERSION metadata and a closed bundled Mach-O dependency graph. It is unsigned and unprovisioned: re-sign with your own Apple identity and provisioning profile before installation. Device playback, App Store approval and TestFlight distribution are not verified by this build.' >> "$GITHUB_STEP_SUMMARY"
