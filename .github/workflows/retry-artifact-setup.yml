name: Retry transient artifact setup

on:
  workflow_run:
    workflows: [build artifacts]
    types: [completed]

permissions:
  actions: write

concurrency:
  group: retry-artifact-setup-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","pull_request"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Rerun failed jobs only for allowlisted setup failures
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/$GH_REPO/actions/runs/$RUN_ID"
          # Compare the current attempt again so a queued retry cannot ignore a
          # rerun already started manually. Use only GitHub job metadata and logs.
          gh api "$endpoint" | jq -e '.run_attempt == 1 and .conclusion == "failure"' >/dev/null || exit 0
          jobs="$(gh api --paginate --slurp "$endpoint/attempts/1/jobs?per_page=100")"
          jq -e '
            [.[].jobs[]] as $jobs
            | [$jobs[] | select(.conclusion == "failure")] as $failed
            | ($failed | length) > 0
              and all($jobs[]; .conclusion == "success" or .conclusion == "skipped" or .conclusion == "failure")
              and all($failed[];
                .name == "Android x86_64 APK"
                and [.steps[] | select(.conclusion == "failure") | .name]
                  == ["Fetch pinned libplacebo for Android host controller"])
          ' <<<"$jobs" >/dev/null || exit 0

          while read -r job_id; do
            log="$RUNNER_TEMP/first-attempt-$job_id.log"
            gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/$job_id/logs" >"$log"
            grep -Eq '^.*[0-9]Z Pinned libplacebo fetch exhausted retries after a transient connection failure\.$' "$log" || exit 0
          done < <(jq -r '.[].jobs[] | select(.conclusion == "failure") | .id' <<<"$jobs")

          gh api --method POST "$endpoint/rerun-failed-jobs"
