name: Bug report
description: Report a reproducible Spool defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste tokens, passwords, Quick Connect values, authorization headers, cookies, raw logs, server URLs/addresses, account/library/media names, or stable item/profile IDs. Use synthetic replacements and review any diagnostic export before attaching it.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v0.x.y
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, webOS]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic names and addresses.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private addresses, personal names, media metadata, and stable Jellyfin identifiers.
          required: true
